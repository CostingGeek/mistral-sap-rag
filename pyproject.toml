[project]
name = "sap-rag-app"
version = "0.2.0"
description = "SAP Customizing RAG application: chat with SAP Customizing documentation via RAG, with citations and corpus scope selection. FastAPI + React."
readme = "README.md"
authors = [
    { name = "Julien Delvat", email = "jdelvat@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "mistralai>=3.2.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.0.0",
    "google-cloud-bigquery",
]

[project.scripts]
sap-rag-app = "sap_rag_app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "detect-secrets>=1.4.0",
    "flake8>=6.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8-bugbear>=23.7.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

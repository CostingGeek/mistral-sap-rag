[project]
name = "sap-rag-app"
version = "0.2.0"
description = "SAP Customizing RAG application: chat with SAP Customizing documentation via RAG, with citations and corpus scope selection. FastAPI + React."
readme = "README.md"
authors = [
    { name = "Julien Delvat", email = "jdelvat@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "mistralai>=3.2.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.0.0",
    "google-cloud-bigquery",
]

[project.scripts]
sap-rag-app = "sap_rag_app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
